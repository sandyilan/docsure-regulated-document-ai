apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8002"]
          env:
            - name: DOCSURE_DB_PATH
              value: /data/docsure.db
            - name: OLLAMA_URL
              value: {{ .Values.ollamaUrl | quote }}
          ports:
            - containerPort: 8002
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.api.servicePort }}
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-dashboard
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["streamlit", "run", "dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8503"]
          env:
            - name: DOCSURE_API_URL
              value: "http://{{ .Release.Name }}-api:8002"
          ports:
            - containerPort: 8503
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  selector:
    app: {{ .Release.Name }}-dashboard
  ports:
    - port: {{ .Values.dashboard.servicePort }}
      targetPort: 8503
