services:
  docsure-api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8002
    environment:
      DOCSURE_DB_PATH: /data/docsure.db
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    ports:
      - "8002:8002"
    volumes:
      - docsure-data:/data

  docsure-dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8503
    environment:
      DOCSURE_API_URL: http://docsure-api:8002
    ports:
      - "8503:8503"
    depends_on:
      - docsure-api

volumes:
  docsure-data:
